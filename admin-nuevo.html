<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Mariscos Boca del Río</title><style>body{font:16px/1.5 system-ui;background:#f4eee3;color:#102a40;margin:0}header{padding:18px;background:#081e32;color:white;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}main{max-width:1150px;margin:25px auto;padding:0 16px}h1,h2{font-family:Georgia,serif}button,.btn{background:#d0a548;border:0;padding:11px 17px;border-radius:24px;cursor:pointer;color:#081e32;font-weight:bold}nav{display:flex;gap:6px;overflow:auto;padding:15px 0}nav button{flex-shrink:0;background:#e4ddd1}.panel{background:white;border-radius:16px;padding:22px;margin:15px 0}label{display:block;margin:12px 0;font-size:.9rem;font-weight:600}input,textarea,select{display:block;width:100%;padding:10px;border:1px solid #aaa;border-radius:7px;font:inherit;box-sizing:border-box}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.entry{border:1px solid #d9d8d4;padding:15px;border-radius:12px;margin:12px 0}small{color:#68727e}#login{max-width:410px;margin:36px auto;text-align:center}#login form{display:flex;flex-direction:column;align-items:center}#login form label{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:10px;text-align:center}#login .pin-label{margin:0 auto 10px}#login .pin-label>span:first-child{display:block;text-align:center;width:100%}#login .pin-wrap{margin:0 auto}#login form>button{display:block;margin:12px auto 0;min-width:155px}#login h1,#login p{text-align:center}#login .admin-username{width:100%;box-sizing:border-box;text-align:center;display:block;margin:12px auto 18px;padding:10px 0}#login .pin-field{width:170px;max-width:100%;font-size:1.3rem;letter-spacing:.22em;text-align:center;padding-right:40px}#login .pin-wrap{position:relative;display:block;width:170px;max-width:100%}#login .pin-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0!important;box-shadow:none!important;background:none!important;padding:5px!important;color:#566676;border-radius:0!important;display:flex;align-items:center;justify-content:center;line-height:1;min-width:0;min-height:0}#login .pin-toggle:hover{color:#102a40;background:none!important}#login .pin-toggle svg{display:block;pointer-events:none}#login .pin-toggle:focus-visible{outline:2px solid #102a40;outline-offset:2px}#message{font-weight:bold}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd}section[hidden]{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.panel{padding:14px}}</style></head><body><header><b>Mariscos Boca del Río · Panel</b><a style="color:white" href="index-nuevo.html">Ver sitio ↗</a></header><main><section id="login" class="panel"><h1>Acceso administrador</h1><p>Para habilitar el acceso se requiere configurar las credenciales privadas del servidor.</p><form id="login-form"><p class="admin-username"><strong>Usuario:</strong> Administrador</p><label class="pin-label"><span>Contraseña:</span><span class="pin-wrap"><input id="password" class="pin-field" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="current-password" title="Introduce de 4 a 6 dígitos numéricos" required><button type="button" class="pin-toggle" id="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label><button>Ingresar</button></form></section><section id="change-pin" class="panel" hidden style="max-width:410px;margin:36px auto;text-align:center"><h2>Cambiar contraseña</h2><p>Por seguridad, establece un nuevo PIN antes de continuar.</p><form id="pin-form"><label>Contraseña actual<input name="current" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required></label><label>Nueva contraseña<input name="next" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required></label><label>Confirmar contraseña<input name="confirm" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required></label><button>Guardar contraseña</button></form><p id="pin-result" role="status"></p></section><section id="workspace" hidden><div style="display:flex;justify-content:flex-end;margin:12px 0"><button id="open-pin" type="button">Cambiar contraseña</button><button id="logout" type="button">Cerrar sesión</button></div><nav id="tabs"></nav><div id="editor" class="panel"></div><p id="message" role="status"></p></section></main><script>
const API='https://mariscos-eventos-api.venturahjorge.workers.dev',modules=['cintillo','hero','destacados','nosotros','celebraciones','servicios','eventos','empresas','contacto','cotizaciones'];let token=localStorage.getItem('mbr_admin_session')||'',section='',db={};
const IDLE_MS=5*60*1000;let lastActivity=Number(localStorage.getItem('mbr_admin_last_activity')||0);
function forgetSession(){token='';localStorage.removeItem('mbr_admin_session');localStorage.removeItem('mbr_admin_last_activity');document.getElementById('workspace').hidden=true;document.getElementById('change-pin').hidden=true;document.getElementById('login').hidden=false;}
async function idleLogout(){if(!token)return;try{await request('/api/admin/logout','POST')}catch{}forgetSession()}
let lastServerTouch=0;
function recordActivity(){if(!token||document.getElementById('workspace').hidden)return;lastActivity=Date.now();localStorage.setItem('mbr_admin_last_activity',String(lastActivity));if(Date.now()-lastServerTouch>30000){lastServerTouch=Date.now();request('/api/admin/session/touch','POST').catch(()=>forgetSession())}}
for(const eventName of ['pointerdown','keydown','input','touchstart'])document.addEventListener(eventName,recordActivity,{passive:true});
setInterval(async()=>{if(!token)return;if(Date.now()-lastActivity>=IDLE_MS){await idleLogout();return}try{await request('/api/admin/session')}catch{forgetSession()}},15000);
document.addEventListener('visibilitychange',()=>{if(token&&!document.hidden&&Date.now()-lastActivity>=IDLE_MS)idleLogout()});

const el=(tag,attrs={},parent)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')e.textContent=v;else e.setAttribute(k,v)}if(parent)parent.appendChild(e);return e};
const request=async(path,method='GET',value)=>{const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:value===undefined?undefined:JSON.stringify(value)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error de conexión');return j};
document.getElementById('toggle-password').onclick=()=>{const p=document.getElementById('password'),b=document.getElementById('toggle-password'),visible=p.type==='password';p.type=visible?'text':'password';b.setAttribute('aria-label',visible?'Ocultar contraseña':'Mostrar contraseña');b.setAttribute('aria-pressed',String(visible));b.title=visible?'Ocultar contraseña':'Mostrar contraseña';};
document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();try{const v=await request('/api/admin/login','POST',{password:document.getElementById('password').value});token=v.token;localStorage.setItem('mbr_admin_session',token);lastActivity=Date.now();localStorage.setItem('mbr_admin_last_activity',String(lastActivity));document.getElementById('password').value='';document.getElementById('login').hidden=true;if(v.mustChange){document.getElementById('change-pin').hidden=false;document.getElementById('workspace').hidden=true}else{document.getElementById('workspace').hidden=false;db=await request('/api/content');drawTabs();switchTab('cintillo')}}catch(e){alert(e.message)}};
document.getElementById('open-pin').onclick=()=>{document.getElementById('workspace').hidden=true;document.getElementById('change-pin').hidden=false;};
document.getElementById('pin-form').onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.currentTarget)),msg=document.getElementById('pin-result');if(fd.next!==fd.confirm){msg.textContent='Las contraseñas no coinciden.';return}try{await request('/api/admin/password','PUT',{current:fd.current,next:fd.next});e.currentTarget.reset();msg.textContent='Contraseña actualizada.';document.getElementById('change-pin').hidden=true;document.getElementById('workspace').hidden=false;db=await request('/api/content');drawTabs();switchTab('cintillo')}catch(err){msg.textContent=err.message}};
document.getElementById('logout').onclick=async()=>{try{await request('/api/admin/logout','POST')}catch{}forgetSession();};
(async()=>{if(!token)return;if(Date.now()-lastActivity>=IDLE_MS){forgetSession();return}try{const status=await request('/api/admin/session');document.getElementById('login').hidden=true;if(status.mustChange){document.getElementById('change-pin').hidden=false}else{db=await request('/api/content');document.getElementById('workspace').hidden=false;drawTabs();switchTab('cintillo')}}catch{forgetSession()}})();
function drawTabs(){const n=document.getElementById('tabs');n.replaceChildren();modules.forEach(k=>{const b=el('button',{text:k.toUpperCase()},n);b.onclick=()=>switchTab(k)})}
function field(parent,title,value,onChange,textarea=false){const l=el('label',{text:title},parent),inp=el(textarea?'textarea':'input',{},l);inp.value=value??'';inp.oninput=()=>onChange(inp.value);return inp}
function switchTab(k){section=k;const root=document.getElementById('editor');root.replaceChildren();el('h2',{text:k.toUpperCase()},root);document.getElementById('message').textContent='';if(k==='cotizaciones'){renderQuotes(root);return}const val=structuredClone(db[k]||{});field(root,'Título',val.titulo,v=>val.titulo=v);field(root,'Subtítulo',val.subtitulo,v=>val.subtitulo=v);if(k==='cintillo')field(root,'Texto superior',val.texto,v=>val.texto=v,true);if(k==='nosotros'){field(root,'Descripción',val.descripcion,v=>val.descripcion=v,true);el('h3',{text:'Misión, visión y valores (JSON)'},root);jsonField(root,val,'valores')}if(k==='hero'||k==='cintillo')field(root,'URL de imagen',val.imagen,v=>val.imagen=v);if(k==='contacto'){el('p',{text:'Los datos que guardes aquí actualizarán enlaces y redes sociales en la página pública.'},root);for(const [key,label,placeholder] of [['direccion','Dirección de oficinas','Calle, número, colonia, ciudad'],['telefono','Teléfono (con clave de área)','228...'],['whatsapp','WhatsApp (52 + 10 dígitos)','52228...'],['correo','Correo electrónico','contacto@empresa.com'],['horario','Horario de atención','Lunes a viernes...'],['facebook','Página de Facebook','https://www.facebook.com/...'],['instagram','Perfil de Instagram','https://www.instagram.com/...'],['tiktok','Perfil de TikTok','https://www.tiktok.com/@...'],['x','Perfil de X','https://x.com/...']]){const input=field(root,label,val[key],v=>val[key]=v);input.placeholder=placeholder;if(['facebook','instagram','tiktok','x'].includes(key))input.type='url';if(key==='correo')input.type='email';}}if(['destacados','celebraciones','servicios','eventos','empresas'].includes(k)){
 el('p',{text:'Edita cada elemento aquí. Para publicar imágenes, utiliza una URL HTTPS pública alojada en GitHub u otro servicio gratuito.'},root);
 if(!Array.isArray(val.items))val.items=[];
 const editor=el('div',{},root),limit=['destacados','celebraciones'].includes(k)?10:k==='servicios'?12:100;
 const redraw=()=>{
 editor.replaceChildren();el('h3',{text:'Fotografías y elementos ('+val.items.length+')'},editor);
 val.items.forEach((item,index)=>{
 const panel=el('div',{class:'entry'},editor);el('b',{text:'Elemento '+(index+1)},panel);
 field(panel,'Título',item.titulo,v=>item.titulo=v);
 const imageField=field(panel,'URL pública de imagen HTTPS',item.imagen,v=>{item.imagen=v;preview.src=v||'';preview.hidden=!v});
 const preview=el('img',{alt:'Vista previa del elemento'},panel);preview.style.cssText='width:100%;max-width:320px;height:150px;object-fit:cover;border-radius:9px;margin:12px 0;display:block';preview.hidden=!item.imagen;if(item.imagen)preview.src=item.imagen;
 if(k==='eventos'){field(panel,'Fecha',item.fecha,v=>item.fecha=v);field(panel,'Descripción',item.descripcion,v=>item.descripcion=v,true)}
 const crop=el('div',{class:'row'},panel);
 field(crop,'Zoom (%)',item.zoom??100,v=>item.zoom=Math.max(100,Math.min(300,Number(v)||100)));
 field(crop,'Posición horizontal (0–100)',item.posX??50,v=>item.posX=Math.max(0,Math.min(100,Number(v)||50)));
 field(panel,'Posición vertical (0–100)',item.posY??50,v=>item.posY=Math.max(0,Math.min(100,Number(v)||50)));
 const remove=el('button',{type:'button',text:'Eliminar elemento'},panel);remove.style.cssText='background:#f5d5d0;margin-top:12px';
 remove.onclick=()=>{if(confirm('¿Eliminar este elemento?')){val.items.splice(index,1);redraw()}};
 });
 if(val.items.length<limit){const add=el('button',{type:'button',text:'+ Agregar elemento'},editor);add.onclick=()=>{val.items.push({titulo:'',imagen:'',zoom:100,posX:50,posY:50,...(k==='eventos'?{fecha:'',descripcion:''}:{})});redraw()}}
 };
 redraw()
}
const save=el('button',{text:'Guardar y publicar cambios'},root);save.onclick=async()=>{try{if(val._parseError)throw Error('Corrige el JSON');delete val._parseError;await request('/api/admin/content','PUT',{key:k,value:val});db[k]=structuredClone(val);document.getElementById('message').textContent='Cambios guardados y publicados.'}catch(e){document.getElementById('message').textContent=e.message}}}
function jsonField(root,val,key){const l=el('label',{text:'Editor de datos'},root),i=el('textarea',{},l);i.style.minHeight='230px';i.value=JSON.stringify(val[key]||[],null,2);i.oninput=()=>{try{val[key]=JSON.parse(i.value);val._parseError=false}catch(e){val._parseError=true}}}
async function renderQuotes(root){try{const quotes=await request('/api/admin/quotes');const wrap=el('div',{},root);wrap.style.overflowX='auto';const table=el('table',{},wrap),head=el('tr',{},table);for(const t of ['Folio','Cliente','Teléfono','Evento','Fecha','Invitados','Estado','Seguimiento'])el('th',{text:t},head);for(const q of quotes){const tr=el('tr',{},table);for(const t of ['MBR-'+String(q.id).padStart(6,'0'),q.name,q.phone,q.type,q.event_date,q.guests])el('td',{text:String(t)},tr);const td=el('td',{},tr),s=el('select',{},td);for(const x of ['nuevo','contactado','cotizado','confirmado','cancelado']){let opt=el('option',{value:x,text:x},s);if(x===q.status)opt.selected=true}s.onchange=async()=>{try{await request('/api/admin/quotes/status','PUT',{id:q.id,status:s.value})}catch(e){alert(e.message)}};const notes=el('td',{},tr),b=el('button',{text:'Ver / Agregar'},notes);b.onclick=async()=>{const old=await request('/api/admin/quotes/notes?id='+q.id);const note=prompt('Notas actuales:\n'+old.map(x=>x.created_at+' '+x.note).join('\n')+'\n\nAgregar nueva nota (cancelar para salir):');if(note?.trim())await request('/api/admin/quotes/note','POST',{id:q.id,note})}}}catch(e){el('p',{text:e.message},root)}}
</script></body></html>
