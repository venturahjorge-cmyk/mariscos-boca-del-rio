<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Mariscos Boca del Río</title><style>body{font:16px/1.5 system-ui;background:#f4eee3;color:#102a40;margin:0}header{padding:18px;background:#081e32;color:white;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}main{max-width:1150px;margin:25px auto;padding:0 16px}h1,h2{font-family:Georgia,serif}button,.btn{background:#d0a548;border:0;padding:11px 17px;border-radius:24px;cursor:pointer;color:#081e32;font-weight:bold}nav{display:flex;gap:6px;overflow:auto;padding:15px 0}nav button{flex-shrink:0;background:#e4ddd1}.panel{background:white;border-radius:16px;padding:22px;margin:15px 0}label{display:block;margin:12px 0;font-size:.9rem;font-weight:600}input,textarea,select{display:block;width:100%;padding:10px;border:1px solid #aaa;border-radius:7px;font:inherit;box-sizing:border-box}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.entry{border:1px solid #d9d8d4;padding:15px;border-radius:12px;margin:12px 0}small{color:#68727e}#message{font-weight:bold}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd}section[hidden]{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.panel{padding:14px}}</style></head><body><header><b>Mariscos Boca del Río · Panel</b><a style="color:white" href="index-nuevo.html">Ver sitio ↗</a></header><main><section id="login" class="panel"><h1>Acceso administrador</h1><p>Para habilitar el acceso se requiere configurar las credenciales privadas del servidor.</p><form id="login-form"><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form></section><section id="workspace" hidden><nav id="tabs"></nav><div id="editor" class="panel"></div><p id="message" role="status"></p></section></main><script>
const API='https://mariscos-eventos-api.venturahjorge.workers.dev',modules=['cintillo','hero','destacados','nosotros','celebraciones','servicios','eventos','empresas','contacto','cotizaciones'];let token='',section='',db={};
const el=(tag,attrs={},parent)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')e.textContent=v;else e.setAttribute(k,v)}if(parent)parent.appendChild(e);return e};
const request=async(path,method='GET',value)=>{const r=await fetch(API+path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:value===undefined?undefined:JSON.stringify(value)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error de conexión');return j};
document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();try{const v=await request('/api/admin/login','POST',{password:document.getElementById('password').value});token=v.token;document.getElementById('password').value='';document.getElementById('login').hidden=true;document.getElementById('workspace').hidden=false;db=await request('/api/content');drawTabs();switchTab('cintillo')}catch(e){alert(e.message)}};
function drawTabs(){const n=document.getElementById('tabs');n.replaceChildren();modules.forEach(k=>{const b=el('button',{text:k.toUpperCase()},n);b.onclick=()=>switchTab(k)})}
function field(parent,title,value,onChange,textarea=false){const l=el('label',{text:title},parent),inp=el(textarea?'textarea':'input',{},l);inp.value=value??'';inp.oninput=()=>onChange(inp.value);return inp}
function switchTab(k){section=k;const root=document.getElementById('editor');root.replaceChildren();el('h2',{text:k.toUpperCase()},root);document.getElementById('message').textContent='';if(k==='cotizaciones'){renderQuotes(root);return}const val=structuredClone(db[k]||{});field(root,'Título',val.titulo,v=>val.titulo=v);field(root,'Subtítulo',val.subtitulo,v=>val.subtitulo=v);if(k==='cintillo')field(root,'Texto superior',val.texto,v=>val.texto=v,true);if(k==='nosotros'){field(root,'Descripción',val.descripcion,v=>val.descripcion=v,true);el('h3',{text:'Misión, visión y valores (JSON)'},root);jsonField(root,val,'valores')}if(k==='hero'||k==='cintillo')field(root,'URL de imagen',val.imagen,v=>val.imagen=v);if(k==='contacto')for(const x of ['direccion','telefono','whatsapp','horario'])field(root,x,val[x],v=>val[x]=v);if(['destacados','celebraciones','servicios','eventos','empresas'].includes(k)){el('h3',{text:'Elementos de la sección (JSON)'},root);el('p',{text:'Cada imagen puede usar una URL pública. Las subidas directas estarán disponibles al habilitar almacenamiento R2.'},root);jsonField(root,val,'items')}const save=el('button',{text:'Guardar cambios'},root);save.onclick=async()=>{try{if(val._parseError)throw Error('Corrige el JSON');delete val._parseError;await request('/api/admin/content','PUT',{key:k,value:val});db[k]=structuredClone(val);document.getElementById('message').textContent='Cambios guardados y publicados.'}catch(e){document.getElementById('message').textContent=e.message}}}
function jsonField(root,val,key){const l=el('label',{text:'Editor de datos'},root),i=el('textarea',{},l);i.style.minHeight='230px';i.value=JSON.stringify(val[key]||[],null,2);i.oninput=()=>{try{val[key]=JSON.parse(i.value);val._parseError=false}catch(e){val._parseError=true}}}
async function renderQuotes(root){try{const quotes=await request('/api/admin/quotes');const wrap=el('div',{},root);wrap.style.overflowX='auto';const table=el('table',{},wrap),head=el('tr',{},table);for(const t of ['Folio','Cliente','Teléfono','Evento','Fecha','Invitados','Estado','Seguimiento'])el('th',{text:t},head);for(const q of quotes){const tr=el('tr',{},table);for(const t of ['MBR-'+String(q.id).padStart(6,'0'),q.name,q.phone,q.type,q.event_date,q.guests])el('td',{text:String(t)},tr);const td=el('td',{},tr),s=el('select',{},td);for(const x of ['nuevo','contactado','cotizado','confirmado','cancelado']){let opt=el('option',{value:x,text:x},s);if(x===q.status)opt.selected=true}s.onchange=async()=>{try{await request('/api/admin/quotes/status','PUT',{id:q.id,status:s.value})}catch(e){alert(e.message)}};const notes=el('td',{},tr),b=el('button',{text:'Ver / Agregar'},notes);b.onclick=async()=>{const old=await request('/api/admin/quotes/notes?id='+q.id);const note=prompt('Notas actuales:\n'+old.map(x=>x.created_at+' '+x.note).join('\n')+'\n\nAgregar nueva nota (cancelar para salir):');if(note?.trim())await request('/api/admin/quotes/note','POST',{id:q.id,note})}}}catch(e){el('p',{text:e.message},root)}}
</script></body></html>
