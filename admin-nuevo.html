<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Administración | Mariscos Boca del Río</title><style>body{font:16px/1.5 system-ui;background:#f4eee3;color:#102a40;margin:0}header{padding:18px;background:#081e32;color:white;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}main{max-width:1150px;margin:25px auto;padding:0 16px}h1,h2{font-family:Georgia,serif}button,.btn{background:#d0a548;border:0;padding:11px 17px;border-radius:24px;cursor:pointer;color:#081e32;font-weight:bold}nav{display:flex;gap:6px;overflow:auto;padding:15px 0}nav button{flex-shrink:0;background:#e4ddd1}.panel{background:white;border-radius:16px;padding:22px;margin:15px 0}label{display:block;margin:12px 0;font-size:.9rem;font-weight:600}input,textarea,select{display:block;width:100%;padding:10px;border:1px solid #aaa;border-radius:7px;font:inherit;box-sizing:border-box}textarea{min-height:110px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.entry{border:1px solid #d9d8d4;padding:15px;border-radius:12px;margin:12px 0}small{color:#68727e}#login{max-width:410px;margin:36px auto;text-align:center}#login form{display:flex;flex-direction:column;align-items:center}#login form label{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:10px;text-align:center}#login .pin-label{margin:0 auto 10px}#login .pin-label>span:first-child{display:block;text-align:center;width:100%}#login .pin-wrap{margin:0 auto}#login form>button{display:block;margin:12px auto 0;min-width:155px}#login h1,#login p{text-align:center}#login .admin-username{width:100%;box-sizing:border-box;text-align:center;display:block;margin:12px auto 18px;padding:10px 0}#login .pin-field{width:170px;max-width:100%;font-size:1.3rem;letter-spacing:.22em;text-align:center;padding-right:40px}#login .pin-wrap{position:relative;display:block;width:170px;max-width:100%}#login .pin-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0!important;box-shadow:none!important;background:none!important;padding:5px!important;color:#566676;border-radius:0!important;display:flex;align-items:center;justify-content:center;line-height:1;min-width:0;min-height:0}#login .pin-toggle:hover{color:#102a40;background:none!important}#login .pin-toggle svg{display:block;pointer-events:none}#login .pin-toggle:focus-visible{outline:2px solid #102a40;outline-offset:2px}#message{font-weight:bold}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd}section[hidden]{display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.panel{padding:14px}}</style></head><body><header><b>Mariscos Boca del Río · Panel</b><a style="color:white" href="index-nuevo.html">Ver sitio ↗</a></header><main><section id="login" class="panel"><h1>Acceso administrador</h1><form id="login-form"><p class="admin-username"><strong>Usuario:</strong> Administrador</p><label class="pin-label"><span>Contraseña:</span><span class="pin-wrap"><input id="password" class="pin-field" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="current-password" title="Introduce de 4 a 6 dígitos numéricos" required><button type="button" class="pin-toggle" id="toggle-password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label><button>Ingresar</button></form></section><section id="change-pin" class="panel" hidden style="max-width:410px;margin:36px auto;text-align:center"><h2>Cambiar contraseña</h2><p>Por seguridad, establece un nuevo PIN antes de continuar.</p><form id="pin-form"><label>Contraseña actual<input name="current" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required></label><label>Nueva contraseña<input name="next" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required></label><label>Confirmar contraseña<input name="confirm" type="password" inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" required></label><button>Guardar contraseña</button></form><p id="pin-result" role="status"></p></section><section id="workspace" hidden><div style="display:flex;justify-content:flex-end;margin:12px 0"><button id="quick-pdf" type="button" style="background:#102a40;color:white">Reporte PDF</button><button id="open-pin" type="button">Cambiar contraseña</button><button id="logout" type="button">Cerrar sesión</button></div><nav id="tabs"></nav><div id="editor" class="panel"></div><p id="message" role="status"></p></section></main><script>
const API=location.origin,modules=['cintillo','hero','destacados','nosotros','celebraciones','servicios','eventos','empresas','contacto','cotizaciones','indicadores','fotografias'];let token=localStorage.getItem('mbr_admin_session')||'',section='',db={};
const IDLE_MS=5*60*1000;let lastActivity=Number(localStorage.getItem('mbr_admin_last_activity')||0);
function forgetSession(){token='';localStorage.removeItem('mbr_admin_session');localStorage.removeItem('mbr_admin_last_activity');document.getElementById('workspace').hidden=true;document.getElementById('change-pin').hidden=true;document.getElementById('login').hidden=false;}
async function idleLogout(){if(!token)return;try{await request('/api/admin/logout','POST')}catch{}forgetSession()}
let lastServerTouch=0;
function recordActivity(){if(!token||document.getElementById('workspace').hidden)return;lastActivity=Date.now();localStorage.setItem('mbr_admin_last_activity',String(lastActivity));if(Date.now()-lastServerTouch>30000){lastServerTouch=Date.now();request('/api/admin/session/touch','POST').catch(()=>forgetSession())}}
for(const eventName of ['pointerdown','keydown','input','touchstart'])document.addEventListener(eventName,recordActivity,{passive:true});
setInterval(async()=>{if(!token)return;if(Date.now()-lastActivity>=IDLE_MS){await idleLogout();return}try{await request('/api/admin/session')}catch{forgetSession()}},15000);
document.addEventListener('visibilitychange',()=>{if(token&&!document.hidden&&Date.now()-lastActivity>=IDLE_MS)idleLogout()});

const el=(tag,attrs={},parent)=>{const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')e.textContent=v;else e.setAttribute(k,v)}if(parent)parent.appendChild(e);return e};
const request=async(path,method='GET',value)=>{const login=path==='/api/admin/login';let r;try{r=await fetch(API+path,{method,headers:login?{'Content-Type':'text/plain;charset=UTF-8'}:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:value===undefined?undefined:JSON.stringify(value)})}catch(e){throw Error('No se pudo conectar con el servidor. Revisa la conexión o inténtalo de nuevo.')}let j;try{j=await r.json()}catch{throw Error('Respuesta inesperada del servidor (HTTP '+r.status+').')}if(!r.ok)throw Error((j.error||'Error de conexión')+(j.code?' ['+j.code+']':''));return j};
document.getElementById('toggle-password').onclick=()=>{const p=document.getElementById('password'),b=document.getElementById('toggle-password'),visible=p.type==='password';p.type=visible?'text':'password';b.setAttribute('aria-label',visible?'Ocultar contraseña':'Mostrar contraseña');b.setAttribute('aria-pressed',String(visible));b.title=visible?'Ocultar contraseña':'Mostrar contraseña';};
document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();try{const v=await request('/api/admin/login','POST',{password:document.getElementById('password').value});token=v.token;localStorage.setItem('mbr_admin_session',token);lastActivity=Date.now();localStorage.setItem('mbr_admin_last_activity',String(lastActivity));document.getElementById('password').value='';document.getElementById('login').hidden=true;if(v.mustChange){document.getElementById('change-pin').hidden=false;document.getElementById('workspace').hidden=true}else{document.getElementById('workspace').hidden=false;db=await request('/api/content');drawTabs();switchTab('cintillo')}}catch(e){alert(e.message)}};
document.getElementById('quick-pdf').onclick=()=>{switchTab('indicadores');document.getElementById('editor').scrollIntoView({behavior:'smooth',block:'start'});};
document.getElementById('open-pin').onclick=()=>{document.getElementById('workspace').hidden=true;document.getElementById('change-pin').hidden=false;};
document.getElementById('pin-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,fd=Object.fromEntries(new FormData(form)),msg=document.getElementById('pin-result'),button=form.querySelector('button[type=submit],button:not([type])');if(fd.next!==fd.confirm){msg.textContent='Las contraseñas no coinciden.';return}button.disabled=true;msg.textContent='Guardando contraseña...';try{await request('/api/admin/password','PUT',{current:fd.current,next:fd.next});form.reset();msg.textContent='Contraseña actualizada correctamente.';document.getElementById('change-pin').hidden=true;document.getElementById('workspace').hidden=false;try{db=await request('/api/content');drawTabs();switchTab('cintillo')}catch(loadError){document.getElementById('message').textContent='Contraseña guardada. No fue posible cargar el editor: '+loadError.message}}catch(err){try{const status=await request('/api/admin/session');if(!status.mustChange){form.reset();document.getElementById('change-pin').hidden=true;document.getElementById('workspace').hidden=false;db=await request('/api/content');drawTabs();switchTab('cintillo');document.getElementById('message').textContent='Cambio de contraseña confirmado. Sesión activa.';return}}catch{}msg.textContent=err.message}finally{button.disabled=false}};
document.getElementById('logout').onclick=async()=>{try{await request('/api/admin/logout','POST')}catch{}forgetSession();};
(async()=>{if(!token)return;if(Date.now()-lastActivity>=IDLE_MS){forgetSession();return}try{const status=await request('/api/admin/session');document.getElementById('login').hidden=true;if(status.mustChange){document.getElementById('change-pin').hidden=false}else{db=await request('/api/content');document.getElementById('workspace').hidden=false;drawTabs();switchTab('cintillo')}}catch{forgetSession()}})();
function drawTabs(){const n=document.getElementById('tabs');n.replaceChildren();modules.forEach(k=>{const b=el('button',{text:k.toUpperCase()},n);b.onclick=()=>switchTab(k)})}
function field(parent,title,value,onChange,textarea=false){const l=el('label',{text:title},parent),inp=el(textarea?'textarea':'input',{},l);inp.value=value??'';inp.oninput=()=>onChange(inp.value);return inp}
async function uploadPhoto(file,button,done){
 if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){alert('Selecciona una fotografía JPG, PNG o WebP.');return}
 if(file.size>16000000){alert('El archivo original no debe superar los 16 MB.');return}
 const label=button.textContent;button.disabled=true;button.textContent='Optimizando y subiendo...';
 try{
  const img=await createImageBitmap(file);
  const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();
  let blob=null;for(const quality of [.8,.7,.6,.5,.4]){
   blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));if(blob&&blob.size<=650000)break;
  }
  if(!blob||blob.size>650000)throw Error('No se pudo optimizar suficientemente esta imagen.');
  const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('No se pudo leer el archivo'));reader.readAsDataURL(blob)});
  const saved=await request('/api/admin/images','POST',{mime:'image/webp',data});
  done(saved.url);button.textContent='Fotografía subida';setTimeout(()=>{button.textContent=label},1500);
 }catch(error){alert('Error al subir fotografía: '+error.message);button.textContent=label}
 finally{button.disabled=false}
}
function uploadControl(parent,onSuccess){
 const wrap=el('div',{},parent);wrap.style.margin='10px 0';
 const input=el('input',{type:'file',accept:'image/jpeg,image/png,image/webp'},wrap);
 const button=el('button',{type:'button',text:'Subir fotografía del equipo'},wrap);
 button.onclick=()=>uploadPhoto(input.files?.[0],button,url=>{onSuccess(url);input.value=''});
 el('small',{text:'JPG, PNG o WebP · Se optimiza antes de guardarse. No requiere enlace externo.'},wrap);
}

function switchTab(k){section=k;const root=document.getElementById('editor');root.replaceChildren();el('h2',{text:k.toUpperCase()},root);document.getElementById('message').textContent='';if(k==='cotizaciones'){renderQuotes(root);return}if(k==='indicadores'){renderIndicators(root);return}if(k==='fotografias'){renderImageLibrary(root);return}const val=structuredClone(db[k]||{});field(root,'Título',val.titulo,v=>val.titulo=v);field(root,'Subtítulo',val.subtitulo,v=>val.subtitulo=v);if(k==='cintillo')field(root,'Texto superior',val.texto,v=>val.texto=v,true);if(k==='nosotros'){field(root,'Descripción',val.descripcion,v=>val.descripcion=v,true);el('h3',{text:'Misión, visión y valores (JSON)'},root);jsonField(root,val,'valores')}if(k==='hero'||k==='cintillo')field(root,'URL de imagen',val.imagen,v=>val.imagen=v);if(k==='hero'){el('h3',{text:'Logotipo oficial del encabezado'},root);el('p',{text:'Selecciona el archivo original del logotipo. Se publicará en el encabezado al guardar.'},root);const logoUrl=field(root,'URL del logotipo',val.logo,v=>val.logo=v);const logoPreview=el('img',{alt:'Vista previa del logotipo'},root);logoPreview.style.cssText='display:block;width:200px;max-height:180px;object-fit:contain;margin:12px 0;background:#102a40;padding:10px';logoPreview.hidden=!val.logo;if(val.logo)logoPreview.src=val.logo;uploadControl(root,url=>{val.logo=url;logoUrl.value=url;logoPreview.src=url;logoPreview.hidden=false})}if(k==='contacto'){el('p',{text:'Los datos que guardes aquí actualizarán enlaces y redes sociales en la página pública.'},root);for(const [key,label,placeholder] of [['direccion','Dirección de oficinas','Calle, número, colonia, ciudad'],['telefono','Teléfono (con clave de área)','228...'],['whatsapp','WhatsApp (52 + 10 dígitos)','52228...'],['correo','Correo electrónico','contacto@empresa.com'],['horario','Horario de atención','Lunes a viernes...'],['facebook','Página de Facebook','https://www.facebook.com/...'],['instagram','Perfil de Instagram','https://www.instagram.com/...'],['tiktok','Perfil de TikTok','https://www.tiktok.com/@...'],['x','Perfil de X','https://x.com/...']]){const input=field(root,label,val[key],v=>val[key]=v);input.placeholder=placeholder;if(['facebook','instagram','tiktok','x'].includes(key))input.type='url';if(key==='correo')input.type='email';}}if(['destacados','celebraciones','servicios','eventos','empresas'].includes(k)){
 el('p',{text:'Edita cada elemento aquí. Para publicar imágenes, utiliza una URL HTTPS pública alojada en GitHub u otro servicio gratuito.'},root);
 if(!Array.isArray(val.items))val.items=[];
 const editor=el('div',{},root),limit=['destacados','celebraciones'].includes(k)?10:k==='servicios'?12:100;
 const redraw=()=>{
 editor.replaceChildren();el('h3',{text:'Fotografías y elementos ('+val.items.length+')'},editor);
 val.items.forEach((item,index)=>{
 const panel=el('div',{class:'entry'},editor);el('b',{text:'Elemento '+(index+1)},panel);
 field(panel,'Título',item.titulo,v=>item.titulo=v);
 const imageField=field(panel,'URL pública de imagen HTTPS',item.imagen,v=>{item.imagen=v;preview.src=v||'';preview.hidden=!v});
 uploadControl(panel,url=>{item.imagen=url;imageField.value=url;preview.src=url;preview.hidden=false});
 const preview=el('img',{alt:'Vista previa del elemento'},panel);preview.style.cssText='width:100%;max-width:320px;height:150px;object-fit:cover;border-radius:9px;margin:12px 0;display:block';preview.hidden=!item.imagen;if(item.imagen)preview.src=item.imagen;
 if(k==='eventos'){
 field(panel,'Fecha del evento',item.fecha,v=>item.fecha=v);
 field(panel,'Descripción',item.descripcion,v=>item.descripcion=v,true);
 if(!Array.isArray(item.imagenes))item.imagenes=item.imagen?[item.imagen]:[];
 const gallery=el('div',{class:'entry'},panel);
 const renderGallery=()=>{
  gallery.replaceChildren();el('h3',{text:'Galería del evento ('+item.imagenes.length+'/10)'},gallery);
  item.imagenes.forEach((url,j)=>{
   const line=el('div',{class:'entry'},gallery);
   field(line,'Fotografía '+(j+1)+' · URL pública HTTPS',url,v=>{item.imagenes[j]=v;pic.src=v;pic.hidden=!v});
   uploadControl(line,url=>{item.imagenes[j]=url;line.querySelector('input:not([type=file])').value=url;pic.src=url;pic.hidden=false});
   const pic=el('img',{alt:'Vista previa galería'},line);pic.style.cssText='width:100%;max-width:220px;height:100px;object-fit:cover;border-radius:8px';pic.hidden=!url;if(url)pic.src=url;
   const del=el('button',{type:'button',text:'Eliminar fotografía '+(j+1)},line);del.onclick=()=>{item.imagenes.splice(j,1);renderGallery()}
  });
  if(item.imagenes.length<10){const add=el('button',{type:'button',text:'+ Agregar fotografía a la galería'},gallery);add.onclick=()=>{item.imagenes.push('');renderGallery()}}
 };
 renderGallery()
}
 const crop=el('div',{class:'row'},panel);
 field(crop,'Zoom (%)',item.zoom??100,v=>item.zoom=Math.max(100,Math.min(300,Number(v)||100)));
 field(crop,'Posición horizontal (0–100)',item.posX??50,v=>item.posX=Math.max(0,Math.min(100,Number(v)||50)));
 field(panel,'Posición vertical (0–100)',item.posY??50,v=>item.posY=Math.max(0,Math.min(100,Number(v)||50)));
 const remove=el('button',{type:'button',text:'Eliminar elemento'},panel);remove.style.cssText='background:#f5d5d0;margin-top:12px';
 remove.onclick=()=>{if(['destacados','celebraciones'].includes(k)&&val.items.length<=2){alert('Conserva al menos dos fotografías para que el carrusel funcione.');return}if(confirm('¿Eliminar el elemento '+(index+1)+'?')){val.items.splice(index,1);redraw()}};
 });
 if(val.items.length<limit){const add=el('button',{type:'button',text:'+ Agregar elemento'},editor);add.onclick=()=>{val.items.push({titulo:'',imagen:'',zoom:100,posX:50,posY:50,...(k==='eventos'?{fecha:'',descripcion:''}:{})});redraw()}}
 };
 redraw()
}
const save=el('button',{text:'Guardar y publicar cambios'},root);save.onclick=async()=>{try{if(['destacados','celebraciones'].includes(k)&&val.items.length<2)throw Error('Para conservar el carrusel automático, mantén al menos 2 fotografías. No se guardó ningún cambio.');if(['destacados','celebraciones'].includes(k)&&val.items.length>10)throw Error('El carrusel admite un máximo de 10 fotografías.');if(val._parseError)throw Error('Corrige el JSON');delete val._parseError;await request('/api/admin/content','PUT',{key:k,value:val});db[k]=structuredClone(val);root.replaceChildren();el('h2',{text:'Cambios guardados'},root);el('p',{text:'La información se publicó correctamente. El formulario está cerrado para evitar modificar accidentalmente otros elementos.'},root);const again=el('button',{type:'button',text:'Editar otro elemento o agregar fotografía'},root);again.onclick=()=>switchTab(k);document.getElementById('message').textContent='Guardado y publicado correctamente.'}catch(e){document.getElementById('message').textContent=e.message}}}
function jsonField(root,val,key){const l=el('label',{text:'Editor de datos'},root),i=el('textarea',{},l);i.style.minHeight='230px';i.value=JSON.stringify(val[key]||[],null,2);i.oninput=()=>{try{val[key]=JSON.parse(i.value);val._parseError=false}catch(e){val._parseError=true}}}

async function renderImageLibrary(root){
 root.replaceChildren();el('h2',{text:'Almacenamiento de fotografías'},root);
 el('p',{text:'Las imágenes en uso están protegidas. Solo puedes eliminar imágenes que ya no se utilizan en ninguna sección.'},root);
 const refresh=el('button',{type:'button',text:'Actualizar inventario'},root);refresh.onclick=()=>renderImageLibrary(root);
 const results=el('div',{},root);
 try{
  const result=await request('/api/admin/images/library');
  const photos=result.images||[], unused=photos.filter(x=>!x.in_use);
  el('p',{text:photos.length+' fotografías almacenadas · '+photos.filter(x=>x.in_use).length+' en uso · '+unused.length+' sin uso'+(result.limited?' (mostrando las 1000 más recientes)':'')},results);
  for(const pic of photos){
   const card=el('div',{class:'entry'},results);card.style.cssText='display:flex;flex-wrap:wrap;gap:14px;align-items:center';
   const img=el('img',{src:'https://mariscos-eventos-api.venturahjorge.workers.dev/api/images/'+pic.id,alt:'Imagen almacenada',loading:'lazy'},card);img.style.cssText='width:135px;height:95px;object-fit:cover;border-radius:8px';
   const info=el('div',{},card);info.style.flex='1';
   el('strong',{text:pic.in_use?'EN USO · Protegida':'SIN USO'},info);
   el('p',{text:'Guardada: '+String(pic.created_at||'')+' UTC · Aproximadamente '+Math.ceil((pic.encoded_size||0)*.75/1024)+' KB'},info);
   if(!pic.in_use){
    const remove=el('button',{type:'button',text:'Eliminar definitivamente'},card);
    remove.onclick=async()=>{if(!confirm('¿Eliminar definitivamente esta fotografía sin uso? Esta acción no se puede deshacer.'))return;remove.disabled=true;try{await request('/api/admin/images/delete','POST',{id:pic.id});card.remove()}catch(e){alert(e.message);remove.disabled=false}};
   }
  }
 }catch(e){el('p',{text:'No se pudo cargar el inventario: '+e.message},results)}
}

async function renderIndicators(root){
 root.replaceChildren();el('h2',{text:'Tablero de indicadores · Eventos y Banquetes'},root);
 el('p',{text:'Indicadores basados en solicitudes registradas. La conversión se calcula como eventos confirmados entre solicitudes recibidas en el período.'},root);
 const filters=el('div',{class:'row'},root);
 const fromLabel=el('label',{text:'Solicitudes recibidas desde'},filters),from=el('input',{type:'date'},fromLabel);
 const toLabel=el('label',{text:'Hasta'},filters),to=el('input',{type:'date'},toLabel);
 const preset=el('div',{class:'row'},root),thisMonth=el('button',{type:'button',text:'Mes actual'},preset),all=el('button',{type:'button',text:'Todo el historial'},preset);
 const download=el('button',{type:'button',text:'DESCARGAR REPORTE PDF'},root);
 download.style.cssText='display:block;margin:18px 0;padding:14px 24px;background:#102a40;color:#fff;border:2px solid #d0a548;border-radius:10px;font-size:1rem;';
 const report=el('div',{},root);
 download.onclick=()=>{
  if(from.value&&to.value&&from.value>to.value){alert('Revisa las fechas del período.');return}
  const content=report.cloneNode(true);

  const html='<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reporte ejecutivo MBR</title>'+style+'</head><body>'+heading+content.outerHTML+'<footer>Dirección General · Documento generado el '+new Date().toLocaleString('es-MX',{timeZone:'America/Mexico_City'})+'. Los resultados corresponden a las solicitudes consultadas en el panel.</footer></body></html>';
  const frame=document.createElement('iframe');frame.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';document.body.appendChild(frame);
  const doc=frame.contentDocument;doc.open();doc.write(html);doc.close();
  setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print();setTimeout(()=>frame.remove(),60000)},350);
 };
 try{

async function renderQuotes(root){
 root.replaceChildren();el('h2',{text:'Seguimiento de cotizaciones'},root);
 const refresh=el('button',{type:'button',text:'Actualizar solicitudes'},root);refresh.onclick=()=>renderQuotes(root);
 const info=el('p',{text:'Consulta las solicitudes, cambia su estado y registra observaciones por folio.'},root);
 try{
  const quotes=await request('/api/admin/quotes');
  if(!quotes.length){el('p',{text:'Aún no hay solicitudes registradas.'},root);return}
  const filterPanel=el('div',{class:'entry'},root);
  el('h3',{text:'Buscar y filtrar solicitudes'},filterPanel);
  const filters=el('div',{class:'row'},filterPanel);
  const customer=el('input',{type:'search',placeholder:'Cliente, teléfono o folio'},filters);
  const status=el('select',{},filters);
  for(const [value,label] of [['','Todos los estatus'],['nuevo','Nuevo'],['contactado','Contactado'],['cotizado','Cotizado'],['confirmado','Confirmado'],['cancelado','Cancelado']])el('option',{value,text:label},status);
  const dates=el('div',{class:'row'},filterPanel);
  const fromLabel=el('label',{text:'Fecha de solicitud: desde'},dates),from=el('input',{type:'date'},fromLabel);
  const toLabel=el('label',{text:'Hasta'},dates),to=el('input',{type:'date'},toLabel);
  const controls=el('div',{class:'row'},filterPanel);
  const reset=el('button',{type:'button',text:'Limpiar filtros'},controls);
  const exportBtn=el('button',{type:'button',text:'Exportar a Excel (CSV)'},controls);
  const count=el('p',{text:''},filterPanel);
  const datePart=q=>String(q.created_at||'').slice(0,10);
  let filtered=quotes.slice();
  const matches=q=>{
   const search=customer.value.trim().toLocaleLowerCase('es-MX');
   const combined=['MBR-'+String(q.id).padStart(6,'0'),q.name,q.phone].join(' ').toLocaleLowerCase('es-MX');
   const day=datePart(q);
   return (!search||combined.includes(search))&&(!status.value||q.status===status.value)&&(!from.value||day>=from.value)&&(!to.value||day<=to.value);
  };
  const refreshFilters=()=>{filtered=quotes.filter(matches);count.textContent=filtered.length+' de '+quotes.length+' solicitudes';tbody.querySelectorAll('tr').forEach((tr,i)=>{tr.hidden=!matches(quotes[i])});exportBtn.disabled=!filtered.length};
  customer.oninput=refreshFilters;status.onchange=refreshFilters;from.onchange=refreshFilters;to.onchange=refreshFilters;
  reset.onclick=()=>{customer.value='';status.value='';from.value='';to.value='';refreshFilters()};
  exportBtn.textContent='Descargar Excel (.xlsx)';
  exportBtn.onclick=async()=>{
    if(!filtered.length)return;
    exportBtn.disabled=true;exportBtn.textContent='Preparando Excel...';
    try{
      if(!window.XLSX){
        await new Promise((resolve,reject)=>{
          const script=document.createElement('script');
          script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
          script.onload=resolve;script.onerror=()=>reject(new Error('No se pudo cargar el generador de Excel. Comprueba tu conexión.'));
          document.head.appendChild(script);
        });
      }
      const headers=['Folio','Fecha de solicitud (UTC)','Cliente','Teléfono','Correo','Tipo de evento','Fecha del evento','Invitados','Estatus','Comentarios iniciales'];
      const rows=filtered.map(q=>['MBR-'+String(q.id).padStart(6,'0'),q.created_at||'',q.name||'',q.phone||'',q.email||'',q.type||'',q.event_date||'',Number(q.guests)||0,q.status||'',q.notes||'']);
      const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
      ws['!cols']=[{wch:17},{wch:23},{wch:30},{wch:18},{wch:30},{wch:26},{wch:18},{wch:12},{wch:17},{wch:55}];
      ws['!autofilter']={ref:'A1:J'+(rows.length+1)};
      for(const addr of Object.keys(ws)){if(addr[0]==='!')continue;const cell=ws[addr];if(cell.t==='s'&&/^[=+@\\-\\t\\r]/.test(cell.v))cell.v="'"+cell.v;}
      const workbook=XLSX.utils.book_new();XLSX.utils.book_append_sheet(workbook,ws,'Cotizaciones');
      XLSX.writeFile(workbook,'MBR-cotizaciones-'+new Date().toISOString().slice(0,10)+'.xlsx');
    }catch(err){alert('No fue posible descargar el Excel: '+err.message)}
    finally{exportBtn.disabled=!filtered.length;exportBtn.textContent='Descargar Excel (.xlsx)'}
  };
  const wrap=el('div',{},root);wrap.style.overflowX='auto';
  const table=el('table',{},wrap),thead=el('thead',{},table),head=el('tr',{},thead);
  for(const t of ['Folio','Cliente','Teléfono','Evento','Fecha','Invitados','Estado','Seguimiento'])el('th',{text:t},head);
  const tbody=el('tbody',{},table);
  for(const q of quotes){
   const tr=el('tr',{},tbody);
   for(const t of ['MBR-'+String(q.id).padStart(6,'0'),q.name,q.phone,q.type,q.event_date,q.guests])el('td',{text:String(t??'')},tr);
   const td=el('td',{},tr),sel=el('select',{},td);
   const estados=['nuevo','contactado','cotizado','confirmado','cancelado'];
   for(const st of estados){const option=el('option',{value:st,text:st[0].toUpperCase()+st.slice(1)},sel);if(st===q.status)option.selected=true}
   let previous=q.status||'nuevo',busy=false;
   const statusMessage=el('small',{text:''},td);
   sel.onchange=async()=>{
    if(busy)return;const next=sel.value;busy=true;sel.disabled=true;statusMessage.textContent='Guardando...';
    try{await request('/api/admin/quotes/status','PUT',{id:q.id,status:next});previous=next;q.status=next;statusMessage.textContent='Estado actualizado.';refreshFilters()}
    catch(err){sel.value=previous;statusMessage.textContent='No se guardó: '+err.message}
    finally{busy=false;sel.disabled=false}
   };
   const notes=el('td',{},tr),button=el('button',{type:'button',text:'Ver seguimiento e historial'},notes);
   const detail=el('div',{},notes);detail.hidden=true;detail.style.cssText='min-width:220px;max-width:340px;margin-top:12px';
   button.onclick=async()=>{
    detail.hidden=!detail.hidden;if(detail.hidden)return;
    detail.replaceChildren();const history=el('div',{},detail);el('p',{text:'Cargando historial...'},history);try{const actions=await request('/api/admin/quotes/history?id='+q.id);history.replaceChildren();el('h4',{text:'Historial de modificaciones'},history);if(!actions.length)el('small',{text:'Todavía no hay modificaciones registradas.'},history);actions.forEach(change=>{const entry=el('div',{class:'entry'},history);const formatted=new Date(String(change.created_at||'').replace(' ','T')+'Z').toLocaleString('es-MX',{timeZone:'America/Mexico_City',dateStyle:'short',timeStyle:'medium'});el('small',{text:formatted+' · '+change.actor},entry);el('p',{text:change.action+': '+(change.old_value?change.old_value+' → ':'')+(change.new_value||'')},entry)})}catch(err){history.replaceChildren();el('p',{text:'No fue posible consultar el historial: '+err.message},history)}const list=el('div',{},detail);el('p',{text:'Cargando notas...'},list);
    try{const old=await request('/api/admin/quotes/notes?id='+q.id);list.replaceChildren();
     if(!old.length)el('small',{text:'Sin observaciones registradas.'},list);
     else old.forEach(note=>{const item=el('div',{class:'entry'},list);el('small',{text:note.created_at||''},item);el('p',{text:note.note||''},item)});
    }catch(err){list.replaceChildren();el('p',{text:'No se pudieron cargar las notas: '+err.message},list)}
    const input=el('textarea',{placeholder:'Nueva observación del seguimiento',maxlength:'1200'},detail);
    const save=el('button',{type:'button',text:'Guardar observación'},detail);
    const message=el('small',{text:''},detail);
    save.onclick=async()=>{const note=input.value.trim();if(!note){message.textContent='Escribe una observación.';return}
     save.disabled=true;message.textContent='Guardando...';
     try{await request('/api/admin/quotes/note','POST',{id:q.id,note});input.value='';message.textContent='Observación guardada.';const item=el('div',{class:'entry'},list);el('small',{text:new Date().toLocaleString('es-MX',{timeZone:'America/Mexico_City'})},item);el('p',{text:note},item)}
     catch(err){message.textContent='No se guardó: '+err.message}
     finally{save.disabled=false}
    }
   }
  }
  refreshFilters();
 }catch(err){el('p',{text:'No se pudieron cargar las cotizaciones: '+err.message},root)}
}
